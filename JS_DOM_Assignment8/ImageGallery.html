<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery Modal</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            gap: 15px;
        }
        .gallery img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 5px;
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            max-width: 80%;
            max-height: 80%;
        }
        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2>Image Gallery</h2>

    <div class="gallery">
        <img src="https://picsum.photos/id/10/300/200">
        <img src="https://picsum.photos/id/20/300/200">
        <img src="https://picsum.photos/id/30/300/200">
        <img src="https://picsum.photos/id/40/300/200">
        <img src="https://picsum.photos/id/50/300/200">
        <img src="https://picsum.photos/id/60/300/200">
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <img id="modalImage" src="">
        </div>
    </div>

    <script>
        const gallery = document.querySelector(".gallery");
        const modal = document.getElementById("modal");
        const modalContent = document.getElementById("modalContent");
        const modalImage = document.getElementById("modalImage");
        
        gallery.addEventListener("click", (event) => {
            if (event.target.tagName === "IMG") {
                modal.style.display = "flex";
                modalImage.src = event.target.src;
            }
        });
        
        modal.addEventListener("click", () => {
            modal.style.display = "none";
        });
        
        modalContent.addEventListener("click", (event) => {
            event.stopPropagation();
        });
    </script>

</body>
</html>
