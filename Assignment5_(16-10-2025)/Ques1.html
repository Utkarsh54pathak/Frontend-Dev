* {

body {

  color: #222;
  background-color: #f5f7fa;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: #003366;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 5%;
  z-index: 100;
}

header h1 {
  font-size: 1.8rem;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 2em;
}

nav a {
  text-decoration: none;
  color: white;
  font-weight: 500;
  transition: color 0.3s;
}

nav a:hover {
  color: #ffcc00;
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding-top: 15vh; 
}

.intro {
  display: flex;
  align-items: center;
  gap: 5%;
  background-color: white;
  width: 80%; 
  padding: 2rem;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

.profile-pic {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 4px solid #003366;
  object-fit: cover;
}

.bio h2 {
  color: #003366;
  margin-bottom: 1em;
}
.bio p {
  font-size: 1rem;
  line-height: 1.6;
  color: #333;
}
footer {
  background-color: #003366;
  color: white;
  text-align: center;
  padding: 1rem;
  margin-top: auto;
}
