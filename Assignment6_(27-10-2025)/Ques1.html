<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Portfolio</title>
        <style>
        * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #0077b6;
                color: white;
                padding: 15px 40px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            nav a {
                color: white;
                text-decoration: none;
                margin-left: 20px;
                font-weight: bold;
            }

            nav a:hover {
                text-decoration: underline;
            }

            main {
                display: flex;
                justify-content: center;
                align-items: center;
                flex: 1;
                padding: 40px;
                gap: 40px;
            }

            .about {
                flex: 1;
            }

            .about h2 {
                margin-bottom: 15px;
                color: #023e8a;
            }

            .about p {
                font-size: 1.1rem;
                line-height: 1.6;
            }

            .image {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .image img {
                width: 80%;
                max-width: 300px;
                border-radius: 10px;
            }

            @media (max-width: 700px) {
                header {
                    flex-direction: column;
                    text-align: center;
                }

                main {
                    flex-direction: column;
                    padding: 20px;
                }

                nav a {
                    display: inline-block;
                    margin: 10px;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Shiv Kumar</h1>
            <nav>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
            </nav>
        </header>

        <main>
            <section class="about" id="about">
                <h2>About Me</h2>
                <p>
                Hello! I’m Shiv Kumar, a passionate web developer and AI enthusiast. I enjoy creating
                visually appealing and responsive websites using modern technologies like HTML, CSS, and JavaScript.
                </p>
            </section>

            <section class="image">
                <img src="https://i.pinimg.com/236x/2f/71/fd/2f71fdb4ea2c6f9dced36b5e66612da5.jpg" alt="Profile Picture">
            </section>
        </main>
    </body>
</html>
