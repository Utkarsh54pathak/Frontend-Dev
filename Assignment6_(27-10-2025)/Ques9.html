<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Card Flip Animation</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                    height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: linear-gradient(135deg, #6a11cb, #2575fc);
                font-family: Arial, sans-serif;
            }

            .card {
                width: 300px;
                height: 400px;
                perspective: 1000px;
            }

            .card-inner {
                position: relative;
                width: 100%;
                height: 100%;
                transform-style: preserve-3d;
                transition: transform 0.8s;
            }

            .card:hover .card-inner {
                transform: rotateY(180deg);
            }

            .card-front, .card-back {
                position: absolute;
                width: 100%;
                height: 100%;
                backface-visibility: hidden;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            }

            .card-front {
                background-color: #fff;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .card-front img {
                width: 100%;
                height: 70%;
                object-fit: cover;
            }

            .card-front h2 {
                padding: 15px;
                font-size: 1.5rem;
                color: #333;
            }

            .card-back {
                background-color: #2575fc;
                color: #fff;
                transform: rotateY(180deg);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 20px;
                text-align: center;
            }

            .card-back p {
                font-size: 1.1rem;
                line-height: 1.5;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085" alt="Tech Image">
                    <h2>Web Development</h2>
                </div>
                <div class="card-back">
                    <h2>About</h2>
                    <p>Web development involves building websites and web apps using HTML, CSS, and JavaScript with creative design and interactive features.</p>
                </div>
            </div>
        </div>
    </body>
</html>
