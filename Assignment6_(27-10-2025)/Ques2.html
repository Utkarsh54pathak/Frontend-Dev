<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Gallery</title>
        <style>
          
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
          
            body {
                font-family: 'Poppins', sans-serif;
                background-color: #f6f6f6;
                padding: 40px;
            }
          
            h1 {
                text-align: center;
                margin-bottom: 30px;
                color: #023e8a;
            }
          
            .gallery {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
          
            .card {
                background: white;
                border-radius: 10px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                padding: 20px;
                text-align: center;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                height: 200px;
            }
          
            .card:hover {
                transform: scale(1.05);
                box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            }
          
            .product-name {
                font-size: 1.1rem;
                font-weight: bold;
                color: #0077b6;
            }
          
            .price {
                margin-top: 10px;
                font-size: 1rem;
                color: #03045e;
            }
          
            @media (max-width: 900px) {
                .gallery {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
          
            @media (max-width: 600px) {
                .gallery {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>

        <h1>Product Gallery</h1>
        <div class="gallery">
            <div class="card">
                <div class="product-name">Smartwatch</div>
                <div class="price">$120</div>
            </div>

            <div class="card">
                <div class="product-name">Wireless Earbuds</div>
                <div class="price">$80</div>
            </div>
            
            <div class="card">
                <div class="product-name">Bluetooth Speaker</div>
                <div class="price">$99</div>
            </div>
            
            <div class="card">
                <div class="product-name">Laptop Stand</div>
                <div class="price">$45</div>
            </div>
            
            <div class="card">
                <div class="product-name">Gaming Mouse</div>
                <div class="price">$55</div>
            </div>
            
            <div class="card">
                <div class="product-name">Keyboard</div>
                <div class="price">$70</div>
            </div>
            
            <div class="card">
                <div class="product-name">Monitor</div>
                <div class="price">$220</div>
            </div>
            
            <div class="card">
                <div class="product-name">Power Bank</div>
                <div class="price">$35</div>
            </div>
        
        </div>

    </body>
</html>
