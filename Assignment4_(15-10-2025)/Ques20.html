<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Gives metadata like charset, description, page summary for search engines, Author information -->
  <meta charset="UTF-8">
  <meta name="description" content="Example page containing important head elements">
  <meta name="author" content="Pushpendra Singh">

  <!-- Sets Base URL for all relative links -->
  <base href="https://example.com/">

  <!-- Title shown in browser tab -->
  <title>Important Head Elements</title>

  <!-- Links external files like icons or styles -->
  <link rel="icon" href="favicon.ico">

  <!-- used For Internal CSS styling -->
  <style>
    body { font-family: Arial; }
  </style>

  <!-- Used to write JavaScript code -->
  <script>
    // Example script (currently empty)
  </script>
</head>
<body>
  <h1>Head Elements Demo</h1>
  <p>Check the source code to see explanations for each head tag.</p>
</body>
</html>
