<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WildTrack Adventure Camp | Registration</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
 
    body {
      background: url('https://imgs.search.brave.com/0x6NaXt5rIcyv3H_Ya6p7l0Hjl1995TCpJF_-HxFAvg/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9tZWRp/YS5pc3RvY2twaG90/by5jb20vaWQvMTcy/MjA4NDkxL3Bob3Rv/L2syLWFuZC1wb3J0/ZXJzLWRpc2N1c3Np/bmctdGhlLW1vbmV5/LmpwZz9zPTYxMng2/MTImdz0wJms9MjAm/Yz1jYnNUR1J1Q09U/VzBKV3lkLXB5eGtw/cVZnTVBqZVI3ck9s/NGhWbjIwRnZFPQ') center/cover no-repeat;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }

   
    .registration-form {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }

    .registration-form h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #2b4d2f;
      font-weight: 700;
    }

    .btn-register {
      background-color: #2b7a4b;
      color: white;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-register:hover {
      background-color: #23663d;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="registration-form">
    <h2>Adventure Camp Registration</h2>
    <form>
   
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your name">
      </div>

      <div class="mb-3">
        <label for="age" class="form-label">Age</label>
        <input type="number" class="form-control" id="age" placeholder="Enter your age">
      </div>

     
      <div class="mb-3">
        <label class="form-label">Gender</label>
        <select class="form-select" id="gender">
          <option selected disabled>Select gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

     
      <div class="mb-3">
        <label for="contact" class="form-label">Contact Number</label>
        <input type="tel" class="form-control" id="contact" placeholder="Enter your contact number">
      </div>

    
      <div class="mb-3">
        <label class="form-label">Camp Type</label>
        <select class="form-select" id="camp-type">
          <option selected disabled>Select camp type</option>
          <option>Hiking Adventure</option>
          <option>River Rafting</option>
          <option>Wildlife Exploration</option>
          <option>Mountain Climbing</option>
        </select>
      </div>


      <button type="submit" class="btn btn-register">Register Now</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
