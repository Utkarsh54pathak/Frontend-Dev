<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Landing Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
.hero {
  background: linear-gradient(to right, #007bff, #00c6ff);
  height: 100vh;
}

header {
  position: sticky;
  top: 0;
  z-index: 1000;
}

footer {
  font-size: 0.9rem;
}

.nav-link:hover {
  color: #ffd700 !important;
}

  </style>
</head>
<body>

  <header class="bg-primary text-white">
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand fw-bold" href="#">TechSpark</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

        <ul class="navbar-nav">
          <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="#" class="nav-link">About</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Services</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <section class="hero d-flex align-items-center text-center text-white">
    <div class="container">
      <div class="row">
        <div class="col">
          <h1 class="display-3 fw-bold">Innovate. Build. Succeed.</h1>
          <p class="lead mb-4">We help startups turn ideas into reality with smart technology solutions.</p>
          <a href="#" class="btn btn-light btn-lg">Get Started</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2025 TechSpark | All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
